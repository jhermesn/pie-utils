name: Doorman
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, synchronize]
permissions: {}
jobs:
  doorman:
    runs-on: ubuntu-latest
    steps:
      - uses: jhermesn/doorman@213688383de50c831579ea6a92db45243b4e352a # v0.3.0
        with:
          org: ${{ vars.FLY_ORG }}
          sprites-token: ${{ secrets.DOORMAN_SPRITES_TOKEN }}
