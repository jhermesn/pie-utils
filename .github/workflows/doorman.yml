name: Doorman
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, synchronize]
permissions: {}
jobs:
  doorman:
    runs-on: ubuntu-latest
    steps:
      - uses: jhermesn/doorman@3757a9edbc4538691212d89aed7e8e53d72bd22e # v0.2.0
        with:
          org: ${{ vars.FLY_ORG }}
          sprites-token: ${{ secrets.DOORMAN_SPRITES_TOKEN }}
